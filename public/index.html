<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bad: #c0453a;
      --r: 20px;
      --shadow: 0 24px 60px rgba(43,74,64,.12);
      --ink: rgba(43,74,64,.62);
      --rm-header-bg: rgba(255,253,248,.9);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--rm-ink);
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(159,187,148,.16), transparent 55%),
        radial-gradient(800px 460px at 100% 10%, rgba(231,196,143,.18), transparent 50%),
        var(--rm-bg);
    }
    .shell { min-height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 32px; border-bottom: 2px solid var(--ink);
      background: var(--rm-header-bg); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 20;
    }
    .theme-toggle {
      position: relative; z-index: 0;
      width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      background: transparent; transition: .15s transform;
    }
    .theme-toggle::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .theme-toggle:hover { transform: rotate(-8deg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .header-user { text-align: right; line-height: 1.3; }
    .header-user b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 14px; color: var(--rm-teal-dark); }
    .header-user span { display: block; font-size: 11px; color: var(--rm-muted); }
    .brand { display: flex; align-items: center; gap: 12px; position: relative; }
    .brand-wash { position: absolute; left: -10px; top: -12px; width: 56px; height: 56px; z-index: 0; pointer-events: none; }
    .brand img { width: 36px; height: 36px; flex-shrink: 0; position: relative; z-index: 1; }
    .brand-text { position: relative; z-index: 1; }
    .brand-text h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 21px; letter-spacing: -.01em; color: var(--rm-teal-dark); }
    .brand-text p { margin: 2px 0 0; color: var(--rm-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .fill-gate {
      flex: 1; display: grid; place-items: center; padding: 32px;
      min-height: calc(100vh - 76px);
    }
    /* Sketch-shape convention: the visible box (fill/border/shadow) lives on
       an empty ::before, and only that pseudo-element gets the wobble filter.
       CSS filters rasterize the whole subtree they're applied to, so putting
       the filter directly on an element with text children would blur/warp
       the text itself — the element with real content stays filter-free and
       sits on top (z-index) of its own decorative ::before. */
    .card {
      position: relative; z-index: 0;
      padding: 30px; width: min(440px, 100%);
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-panel); border: 2px solid var(--ink); border-radius: var(--r);
      box-shadow: var(--shadow);
      filter: url(#sketchWobbleBold);
    }
    h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; color: var(--rm-teal-dark); }
    .sub { color: var(--rm-muted); line-height: 1.55; margin: 0 0 22px; font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 12.5px; color: var(--rm-muted); margin-bottom: 14px; }
    .input-wrap { position: relative; z-index: 0; }
    .input-wrap::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-input-bg); border: 2px solid var(--ink); border-radius: 10px;
      filter: url(#sketchWobble);
    }
    .input-wrap.pill::before { border-radius: 999px; }
    .input-wrap input, .input-wrap textarea {
      position: relative; z-index: 1; display: block;
      width: 100%; padding: 12px 14px; border: none; background: transparent;
      color: var(--rm-ink); font: inherit; font-size: 15px; box-sizing: border-box;
    }
    .input-wrap textarea { min-height: 70px; font-size: 14px; resize: vertical; }
    input:focus-visible, .btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .btn {
      position: relative; z-index: 0;
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 600;
      border-radius: 999px; padding: 12px 20px; font-size: 14px; transition: .15s transform;
      background: transparent;
    }
    .btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      filter: url(#sketchWobble);
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px) rotate(-0.4deg); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #2b1f0d; }
    .primary::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink); }
    .ghost { color: var(--rm-teal-dark); }
    .ghost::before { background: transparent; border: 2px solid var(--ink); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .muted { color: var(--rm-muted); font-size: 13px; }
    .err {
      position: relative; z-index: 0;
      color: var(--bad); padding: 12px 14px; font-size: 13px; margin-top: 12px;
    }
    .err::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px;
      background: rgba(192,69,58,.08); border: 2px solid var(--bad);
      filter: url(#sketchWobble);
    }
    :root {
      --rm-bg: #fbf7ec;
      --rm-panel: #ffffff;
      --rm-line: rgba(43,74,64,.12);
      --rm-teal: #3e7565;
      --rm-teal-dark: #2b4a40;
      --rm-sage: #9fbb94;
      --rm-tan: #e7c48f;
      --rm-ink: #24352e;
      --rm-muted: #5f7268;
      --rm-bubble-them-bg: #f1ead9;
      --rm-input-bg: #fffdf8;
    }
    :root[data-theme="dark"] {
      --rm-bubble-them-bg: #33443d;
      --rm-input-bg: #2a3a34;
      --bad: #e2685c;
      --shadow: 0 24px 60px rgba(0,0,0,.55);
      --ink: rgba(223,232,220,.55);
      --rm-header-bg: rgba(20,28,25,.85);
      --rm-bg: #1b2420;
      --rm-panel: #24342f;
      --rm-line: rgba(255,255,255,.14);
      --rm-teal: #5fa38c;
      --rm-teal-dark: #bfe0cf;
      --rm-sage: #8fb490;
      --rm-tan: #eccb98;
      --rm-ink: #eef2ea;
      --rm-muted: #9fb3a8;
    }
    .rm-page { background: var(--rm-bg); flex: 1; min-height: calc(100vh - 76px); padding: 32px; }
    .rm-topbar { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .rm-topbar b { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--rm-muted); }
    .rm-exit-btn {
      border: none; background: transparent; cursor: pointer; font: inherit;
      font-size: 12px; font-weight: 600; color: var(--rm-muted); padding: 4px 0;
    }
    .rm-exit-btn:hover { color: var(--rm-teal-dark); text-decoration: underline; }
    .rm-exit-btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; color: var(--rm-teal-dark); margin: 0 0 6px; }
    .rm-sub { color: var(--rm-muted); font-size: 14px; margin: 0 0 22px; max-width: 60ch; line-height: 1.5; }
    .rm-hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    @media (max-width: 900px) { .rm-hero-grid { grid-template-columns: 1fr; } }
    .rm-hero {
      position: relative; z-index: 0;
      cursor: pointer; border: none; background: transparent; font: inherit; text-align: left;
      padding: 0; display: flex; flex-direction: column; transition: .2s transform;
    }
    .rm-hero::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-hero:hover { transform: translateY(-5px) rotate(-0.6deg) scale(1.015); }
    .rm-hero:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; }
    .rm-hero-scene { padding: 20px 20px 0; height: 190px; display: flex; align-items: center; justify-content: center; }
    .rm-hero-scene svg { width: 100%; height: 100%; overflow: visible; }
    .rm-hero-cap { padding: 14px 20px 20px; }
    .rm-hero-cap b { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 19px; color: var(--rm-teal-dark); display: block; margin-bottom: 4px; }
    .rm-hero-cap span { font-size: 12.5px; color: var(--rm-muted); display: block; margin-bottom: 14px; }
    .rm-hero-start { position: relative; z-index: 0; display: inline-block; padding: 8px 18px; font-weight: 700; font-size: 12.5px; color: #2b1f0d; }
    .rm-hero-start::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-secondary-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 22px; }
    .rm-secondary-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--rm-muted); margin-right: 4px; }
    .rm-chip {
      position: relative; z-index: 0;
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px;
      font: inherit; font-size: 13px; font-weight: 600; color: var(--rm-teal-dark);
      cursor: pointer; border: none; background: transparent;
    }
    .rm-chip::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-chip:hover { transform: translateY(-1px); }
    .rm-chip:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 30px; }
    .rm-card {
      position: relative; z-index: 0;
      padding: 20px 16px; text-align: left; cursor: pointer; font: inherit; color: var(--rm-ink);
      display: flex; flex-direction: column; gap: 8px; transition: .15s transform; background: transparent; border: none;
    }
    .rm-card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-card:hover { transform: translateY(-2px) rotate(-0.3deg); }
    .rm-card:hover::before { border-color: var(--rm-teal); }
    .rm-card:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-card .rm-ico { font-size: 26px; }
    .rm-card b { font-family: Fraunces, Georgia, serif; font-size: 16px; color: var(--rm-teal-dark); }
    .rm-card span { font-size: 12.5px; color: var(--rm-muted); }
    .rm-freeform { position: relative; z-index: 0; padding: 20px; }
    .rm-freeform::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-btn {
      position: relative; z-index: 0;
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 600;
      border-radius: 999px; padding: 11px 18px; font-size: 13.5px; transition: .15s transform; background: transparent;
    }
    .rm-btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      filter: url(#sketchWobble);
    }
    .rm-btn:hover:not(:disabled) { transform: translateY(-1px) rotate(-0.4deg); }
    .rm-btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rm-btn.primary { color: #2b1f0d; }
    .rm-btn.primary::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink); }
    .rm-btn.ghost { color: var(--rm-teal-dark); }
    .rm-btn.ghost::before { background: transparent; border: 2px solid var(--ink); }
    .rm-btn.mic { color: #fff; }
    .rm-btn.mic::before { background: var(--rm-teal); border: 2px solid var(--ink); }
    .rm-btn.mic.on::before { background: var(--bad); }
    .rm-session { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 720px; margin: 0 auto; }
    .rm-log {
      position: relative; z-index: 0;
      padding: 16px; height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .rm-log::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
    .rm-bubble .who { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; color: var(--rm-muted); }
    .rm-bubble.me { align-self: flex-end; background: var(--rm-sage); color: #16261d; }
    .rm-bubble.them { align-self: flex-start; background: var(--rm-bubble-them-bg); color: var(--rm-ink); }
    .rm-bubble.sys { align-self: center; color: var(--rm-muted); font-size: 12px; font-style: italic; }
    .rm-controls { display: flex; gap: 8px; align-items: center; }
    .rm-mic-state { font-size: 12px; color: var(--rm-muted); text-align: center; margin: 6px 0 0; }
    .rm-btn.sm { padding: 6px 12px; font-size: 12px; }
    .rm-stage { position: relative; z-index: 0; max-width: 720px; margin: 0 auto; padding: 22px 22px 20px; }
    .rm-stage::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 22px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-stage-scene { height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .rm-stage-scene svg { width: 100%; height: 100%; overflow: visible; }
    .rm-slide-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 10px; font-size: 12.5px; color: var(--rm-muted); }
    .rm-stage-divider { border: none; border-top: 2px dashed var(--rm-line); margin: 0 0 14px; }
    .rm-stage-log { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 12px; }
    .rm-stage-controls { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .rm-stage-mic-state { font-size: 12px; color: var(--rm-muted); text-align: center; margin: 6px 0 0; }
    .rm-mic-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 2px; }
    .rm-caption { min-height: 20px; text-align: center; font-size: 13.5px; color: var(--rm-ink); max-width: 48ch; margin: 0 0 12px; line-height: 1.5; }
    .rm-caption .who { font-weight: 700; color: var(--rm-muted); text-transform: uppercase; font-size: 10px; letter-spacing: .05em; margin-right: 6px; }
    .rm-mic-big {
      position: relative; z-index: 0;
      width: 92px; height: 92px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 34px; color: #fff; display: flex; align-items: center; justify-content: center;
      transition: .15s transform;
    }
    .rm-mic-big::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: var(--rm-teal); border: 3px solid var(--ink); filter: url(#sketchWobbleBold);
    }
    .rm-mic-big:hover { transform: scale(1.04) rotate(-2deg); }
    .rm-mic-big:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; }
    .rm-mic-big.on::before { background: var(--bad); }
    .rm-mic-big.on { animation: micPulse 1.6s ease-in-out infinite; }
    @keyframes micPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { .rm-mic-big.on { animation: none; } }
    .rm-mic-secondary { display: flex; gap: 8px; margin-top: 12px; }
    .rm-transcript-panel { width: 100%; margin-top: 12px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
    .rm-type-panel { width: 100%; margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .rm-rubric { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
    .rm-rubric .blk { position: relative; z-index: 0; padding: 18px 20px; }
    .rm-rubric .blk::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-rubric .blk h4 { margin: 0 0 8px; font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); font-size: 15px; }
    .rm-rubric .blk p { margin: 0; color: var(--rm-ink); font-size: 14px; line-height: 1.6; }
    .rm-cam { position: fixed; right: 18px; bottom: 18px; width: 160px; border-radius: 14px; overflow: hidden; border: 2px solid var(--rm-teal); box-shadow: 0 10px 30px rgba(0,0,0,.3); background:#000; z-index: 50; }
    .rm-cam video { width: 100%; display: block; transform: scaleX(-1); }
    .rm-cam-close {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
      border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 20px;
      cursor: pointer; padding: 0;
    }
    .rm-wpm-badge {
      position: fixed; left: 18px; top: 90px; z-index: 45;
      padding: 10px 16px; border-radius: 14px; text-align: center; min-width: 66px;
    }
    .rm-wpm-badge::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 14px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-wpm-badge b { display: block; font-size: 22px; font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); line-height: 1; }
    .rm-wpm-badge span { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--rm-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="sketchWobble" x="-20%" y="-30%" width="140%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="sketchWobbleBold" x="-20%" y="-30%" width="140%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="11" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div class="shell">
    <header>
      <div class="brand">
        <svg class="brand-wash" viewBox="0 0 56 56" aria-hidden="true">
          <path d="M28,4 C40,3 51,12 51,26 C52,40 40,51 27,51 C13,52 4,41 4,27 C3,14 15,5 28,4 Z"
                fill="var(--rm-tan)" opacity="0.35" transform="rotate(-6 28 28)" filter="url(#sketchWobbleBold)" />
        </svg>
        <img src="/logo.png" alt="" />
        <div class="brand-text">
          <h1>Green Room</h1>
          <p>Practice space</p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-user" id="headerUser" hidden></div>
        <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>
    <main id="main"></main>
  </div>

<script>
const S = {
  token: localStorage.getItem("greenRoomToken") || "",
  student: null,
  screen: "gate",
  authMode: "register",
  practiceTemplate: null,
  practiceLog: [],
  micOn: false,
  micStartedAt: 0,
  camDismissed: false,
  sending: false,
  rubric: null,
  viaFreeText: false,
  slides: [],
  slideIndex: 0,
  showTranscript: false,
  showTypeInput: false,
  liveWpm: null,
  setupTemplateId: null,
};

const main = document.getElementById("main");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("greenRoomTheme", theme);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
(() => {
  const saved = localStorage.getItem("greenRoomTheme");
  const preferred = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
})();
document.getElementById("themeToggle").onclick = toggleTheme;

const SESSION_COUNT_KEY = "greenRoomSessionCount";
function getSessionCount() {
  return Number(localStorage.getItem(SESSION_COUNT_KEY) || 0);
}
function incrementSessionCount() {
  const next = getSessionCount() + 1;
  localStorage.setItem(SESSION_COUNT_KEY, String(next));
  return next;
}
function renderHeaderUser() {
  const el = document.getElementById("headerUser");
  if (!el) return;
  if (!S.student) { el.hidden = true; return; }
  const count = getSessionCount();
  const level = Math.floor(count / 3) + 1;
  el.hidden = false;
  el.innerHTML = `<b>${esc(S.student.name || "")}</b><span>Level ${level} · ${count} session${count === 1 ? "" : "s"}</span>`;
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}

function err(e) {
  const el = $("#err");
  if (el) el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
}
function status(msg) {
  const el = $("#status");
  if (el) el.textContent = msg || "";
}

function render() {
  if (S.screen === "picker") renderPicker();
  else if (S.screen === "setup") renderSetup();
  else if (S.screen === "practice") (S.viaFreeText ? renderPracticeChat() : renderPracticeStaged());
  else if (S.screen === "practiceEnd") renderPracticeEnd();
  else renderGate();
}

async function startPracticeDirect(templateId, setupAnswer) {
  try {
    status("Setting the scene…");
    const t = CARD_TEMPLATES.find((x) => x.id === templateId);
    const description = setupAnswer ? `${t.defaultDescription} Specifically: ${setupAnswer}` : t.defaultDescription;
    const started = await api("/api/practice/start", { studentId: S.token, templateId, description, setupAnswer });
    beginPracticeSession(started, false);
  } catch (e) { err(e); }
}

async function startPracticeFromDescription() {
  try {
    const description = $("#freeDesc").value.trim();
    if (!description) { err(new Error("Describe your scenario first")); return; }
    status("Figuring out the best fit…");
    const inferred = await api("/api/practice/infer-scenario", { studentId: S.token, description });
    const started = await api("/api/practice/start", { studentId: S.token, templateId: inferred.templateId, description });
    beginPracticeSession(started, true);
  } catch (e) { err(e); }
}

function beginPracticeSession(started, viaFreeText) {
  S.practiceTemplate = started.practice;
  S.practiceLog = [{ role: "agent", name: "Facilitator", text: started.opener }];
  S.sending = false;
  S.viaFreeText = !!viaFreeText;
  S.camDismissed = false;
  S.showTranscript = false;
  S.showTypeInput = false;
  S.liveWpm = null;
  S.slides.forEach((u) => URL.revokeObjectURL(u));
  S.slides = [];
  S.slideIndex = 0;
  S.screen = "practice";
  render();
  speak(started.opener, "facilitator");
}

let camRequesting = false;

function camWidgetHtml() {
  if (S.camDismissed) return "";
  return `<div class="rm-cam" id="camWrap">
    <video id="camVideo" autoplay playsinline muted></video>
    <button class="rm-cam-close" id="camClose" title="Turn off camera">✕</button>
  </div>`;
}

function wireCamWidget() {
  const closeEl = $("#camClose");
  if (closeEl) closeEl.onclick = dismissCamPreview;
  mountCamPreview();
}

function mountCamPreview() {
  if (S.camDismissed || !navigator.mediaDevices?.getUserMedia) return;
  const videoEl = $("#camVideo");
  if (!videoEl) return;
  if (camStream) {
    videoEl.srcObject = camStream;
    return;
  }
  if (camRequesting) return;
  camRequesting = true;
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then((stream) => {
      camRequesting = false;
      if (S.camDismissed) { stream.getTracks().forEach((t) => t.stop()); return; }
      camStream = stream;
      const el = $("#camVideo");
      if (el) el.srcObject = stream;
      else stream.getTracks().forEach((t) => t.stop());
    })
    .catch((e) => {
      camRequesting = false;
      console.error("camera preview unavailable", e);
    });
}

function stopCamPreview() {
  if (camStream) {
    camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
  }
}

function dismissCamPreview() {
  S.camDismissed = true;
  stopCamPreview();
  render();
}

  S.slides.forEach((u) => URL.revokeObjectURL(u));

}

  if (logEl) logEl.scrollTop = logEl.scrollHeight;
  $("#micBig").onclick = toggleMic;
  $("#toggleTranscript").onclick = () => { S.showTranscript = !S.showTranscript; render(); };
  $("#toggleType").onclick = () => { S.showTypeInput = !S.showTypeInput; render(); };
  const textIn = $("#textIn");
  if (textIn) {
    textIn.focus();
    $("#sendBtn").onclick = () => {
      const v = textIn.value.trim();
      if (v) sendPracticeMessage(v);
    };
    textIn.addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("#sendBtn").click();
    });
  }
  $("#endBtn").onclick = endPracticeSession;
  $("#exitBtn").onclick = discardPracticeSession;
  wireCamWidget();
  if (templateId === "pitch") {
    const fileEl = $("#slideFile");
    if (fileEl) fileEl.onchange = (e) => handleSlideFiles(e.target.files);
    const prevEl = $("#slidePrev");
    if (prevEl) prevEl.onclick = () => { S.slideIndex = (S.slideIndex - 1 + S.slides.length) % S.slides.length; render(); };
    const nextEl = $("#slideNext");
    if (nextEl) nextEl.onclick = () => { S.slideIndex = (S.slideIndex + 1) % S.slides.length; render(); };
  }
}

function renderPracticeChat() {
  main.innerHTML = `
    <div class="rm-page">
      <div class="rm-topbar"><button class="rm-exit-btn" id="exitBtn">← Exit</button><b>${esc(S.practiceTemplate?.templateName || "Practice session")}</b></div>
      <div class="rm-session">
        <div class="rm-log" id="log">
          ${renderLogBubbles()}
        </div>
        <div class="rm-controls">
          <button class="rm-btn mic ${S.micOn ? "on" : ""}" id="micBtn">${S.micOn ? "⏹ Stop" : "🎤 Speak"}</button>
          <div class="input-wrap pill" style="flex:1"><input type="text" id="textIn" placeholder="Or type here…" /></div>
          <button class="rm-btn primary" id="sendBtn">Send</button>
        </div>
        <p class="rm-mic-state">${S.micOn ? "Listening…" : "Mic is off — tap to speak, or type instead"}</p>
        <div class="actions" style="justify-content:center">

        </div>

      </div>

      ${wpmBadgeHtml()}
    </div>`;
  const logEl = $("#log");
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
  $("#micBtn").onclick = toggleMic;
  $("#sendBtn").onclick = () => {
    const v = $("#textIn").value.trim();
    if (v) sendPracticeMessage(v);
  };
  $("#textIn").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("#sendBtn").click();
  });
  $("#endBtn").onclick = endPracticeSession;

async function sendPracticeMessage(text, durationSec) {
  if (S.sending) return;
  S.practiceLog.push({ role: "student", text });
  S.sending = true;
  render();
  try {
    const body = { studentId: S.token, text };
    if (typeof durationSec === "number" && durationSec > 0) body.durationSec = durationSec;
    const j = await api("/api/practice/message", body);
    for (const r of j.responses) S.practiceLog.push({ role: "agent", name: r.name, text: r.reply });
    S.sending = false;
    render();
    speakSequence(j.responses.map((r) => ({ text: r.reply, personaId: r.personaId })));
  } catch (e) {
    S.sending = false;
    render();
    err(e);
  }
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micStopRequested = false;
let micTranscriptParts = [];
let micFatalError = false;

// The browser's SpeechRecognition can fire `onend` on its own during a pause
// (silence-detection auto-stop) even in continuous mode. From the student's
// perspective the mic must only ever stop when they press Stop — so `onend`
// checks micStopRequested: if they didn't ask for it, we restart seamlessly
// instead of ending the turn, and keep accumulating into the same transcript.
function toggleMic() {
  if (!SpeechRec) {
    alert("Speech recognition isn't supported in this browser. Try Chrome.");
    return;
  }
  if (S.micOn) {
    micStopRequested = true;
    recognition && recognition.stop();
    return;
  }
  startRecognition();
}

function startRecognition() {
  micStopRequested = false;
  micFatalError = false;
  micTranscriptParts = [];
  recognition = new SpeechRec();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.onstart = () => {
    S.micOn = true;
    if (!S.micStartedAt) S.micStartedAt = performance.now();
    render();
  };
  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) micTranscriptParts.push(res[0].transcript.trim());
    }
  };
  recognition.onerror = (e) => {
    console.error("speech recognition error", e.error);
    // Permission/device errors are fatal — don't loop restarting forever.
    // Everything else (no-speech, network blips, aborted) is transient;
    // onend decides whether to restart.
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
      micFatalError = true;
      micStopRequested = true;
    }
  };
  recognition.onend = () => {
    if (micStopRequested) {
      S.micOn = false;
      const durationSec = S.micStartedAt ? (performance.now() - S.micStartedAt) / 1000 : 0;
      S.micStartedAt = 0;
      const text = micTranscriptParts.join(" ").trim();
      if (text && durationSec >= 0.5) {
        const wordCount = text.split(/\s+/).filter(Boolean).length;
        S.liveWpm = Math.round(wordCount / (durationSec / 60));
      }
      render();
      if (text) sendPracticeMessage(text, durationSec);
      else if (micFatalError) alert("Couldn't access the microphone. Check your browser's mic permission for this site.");
    } else {
      // Unexpected auto-stop mid-thought — restart without the student noticing.
      // A short delay avoids some browsers throwing if start() is called too
      // soon after the previous session's onend.
      setTimeout(() => {
        try { recognition.start(); } catch (e) { console.error("mic restart failed", e); }
      }, 50);
    }
  };
  try { recognition.start(); } catch (e) { console.error(e); }
}

function playAudioBlob(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    const done = () => { URL.revokeObjectURL(url); resolve(); };
    audio.addEventListener("ended", done);
    audio.addEventListener("error", done);
    audio.play().catch(done);
  });
}

async function speak(text, personaId) {
  if (!text) return;
  try {
    const res = await fetch("/api/practice/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, personaId: personaId || "facilitator" }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    await playAudioBlob(blob);
  } catch (e) {
    console.error("speak failed", e);
  }
}

async function speakSequence(items) {
  for (const item of items) await speak(item.text, item.personaId);
}

async function endPracticeSession() {
  try {
    status("Putting together your feedback…");
    const j = await api("/api/practice/end", { studentId: S.token });
    stopCamPreview();
    S.rubric = j.rubric;
    S.screen = "practiceEnd";
    incrementSessionCount();
    render();
    renderHeaderUser();
  } catch (e) { err(e); }
}

function renderPracticeEnd() {
  const r = S.rubric || {};
  main.innerHTML = `
    <div class="rm-page">
      <div class="rm-topbar"><b>How it went</b></div>
      <h2 class="rm-h2">Nice work, ${esc(S.student?.name || "")}</h2>
      <p class="rm-sub">Here's how your practice session went — no scores, just notes to build on.</p>
      <div class="rm-rubric">
        <div class="blk"><h4>Articulation</h4><p>${esc(r.articulation || "—")}</p></div>
        <div class="blk"><h4>Engagement</h4><p>${esc(r.engagement || "—")}</p></div>
        <div class="blk"><h4>Content correspondence</h4><p>${esc(r.contentCorrespondence || "—")}</p></div>
      </div>
      <div class="actions" style="justify-content:center;margin-top:20px">
        <button class="rm-btn primary" id="again">Practice again</button>
      </div>
    </div>`;
  $("#again").onclick = () => {
    S.screen = "picker";
    S.practiceLog = [];
    S.rubric = null;
    render();
  };
}

(async () => {
  if (S.token) {
    try {
      const j = await api("/api/student/" + S.token);
      S.student = j.student;
      S.screen = "picker";
    } catch {
      localStorage.removeItem("greenRoomToken");
      S.token = "";
      S.screen = "gate";
    }
  }
  render();
  renderHeaderUser();
})();
</script>
