<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bad: #c0453a;
      --r: 20px;
      --shadow: 0 24px 60px rgba(43,74,64,.12);
      --ink: rgba(43,74,64,.62);
      --rm-header-bg: rgba(255,253,248,.9);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--rm-ink);
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(159,187,148,.16), transparent 55%),
        radial-gradient(800px 460px at 100% 10%, rgba(231,196,143,.18), transparent 50%),
        var(--rm-bg);
    }
    .shell { min-height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 32px; border-bottom: 2px solid var(--ink);
      background: var(--rm-header-bg); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 20;
    }
    .theme-toggle {
      position: relative; z-index: 0;
      width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      background: transparent; transition: .15s transform;
    }
    .theme-toggle::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .theme-toggle:hover { transform: rotate(-8deg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .header-user { text-align: right; line-height: 1.3; }
    .header-user-main { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; }
    .header-user b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 14px; color: var(--rm-teal-dark); }
    .header-user span { display: block; font-size: 11px; color: var(--rm-muted); }
    .logout-link {
      appearance: none; border: none; background: transparent; padding: 0;
      color: var(--rm-muted); cursor: pointer; font: inherit; font-size: 11px;
      line-height: 1.2; text-decoration: underline; text-underline-offset: 2px;
    }
    .logout-link:hover { color: var(--rm-teal-dark); }
    .logout-link:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; border-radius: 4px; }
    .founder-link {
      appearance: none; border: none; background: transparent; padding: 0;
      color: var(--rm-muted); cursor: pointer; font: inherit; font-size: 12px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    }
    .founder-link:hover { color: var(--rm-teal-dark); text-decoration: underline; text-underline-offset: 3px; }
    .founder-link:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; border-radius: 5px; }
    .brand {
      display: flex; align-items: center; gap: 12px; position: relative;
      border: none; background: transparent; padding: 0; font: inherit; text-align: left; cursor: pointer;
    }
    .brand:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 4px; border-radius: 8px; }
    .brand-wash { position: absolute; left: -10px; top: -12px; width: 56px; height: 56px; z-index: 0; pointer-events: none; }
    .brand img { width: 36px; height: 36px; flex-shrink: 0; position: relative; z-index: 1; }
    .brand-text { position: relative; z-index: 1; }
    .brand-text h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 21px; letter-spacing: -.01em; color: var(--rm-teal-dark); }
    .brand-text p { margin: 2px 0 0; color: var(--rm-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .rm-modal-backdrop {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      padding: 24px; background: rgba(27,36,32,.42); backdrop-filter: blur(6px);
    }
    .rm-founder-modal {
      position: relative; z-index: 0; width: min(560px, 100%); padding: 28px;
      color: var(--rm-ink);
    }
    .rm-founder-modal::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      box-shadow: var(--shadow); filter: url(#sketchWobbleBold);
    }
    .rm-founder-modal h2 {
      margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-weight: 600;
      font-size: 26px; color: var(--rm-teal-dark);
    }
    .rm-founder-modal p { margin: 0 0 12px; color: var(--rm-ink); line-height: 1.65; font-size: 15px; }
    .rm-founder-modal .signoff { color: var(--rm-muted); font-size: 13px; margin-bottom: 0; }
    .rm-modal-close {
      position: absolute; top: 12px; right: 14px; width: 30px; height: 30px;
      border-radius: 50%; border: none; background: transparent; cursor: pointer;
      color: var(--rm-muted); font-size: 18px; line-height: 30px;
    }
    .rm-modal-close:hover { color: var(--rm-teal-dark); }
    .rm-modal-close:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .fill-gate {
      flex: 1; display: grid; place-items: center; padding: 32px;
      min-height: calc(100vh - 76px);
    }
    /* Sketch-shape convention: the visible box (fill/border/shadow) lives on
       an empty ::before, and only that pseudo-element gets the wobble filter.
       CSS filters rasterize the whole subtree they're applied to, so putting
       the filter directly on an element with text children would blur/warp
       the text itself - the element with real content stays filter-free and
       sits on top (z-index) of its own decorative ::before. */
    .card {
      position: relative; z-index: 0;
      padding: 30px; width: min(440px, 100%);
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-panel); border: 2px solid var(--ink); border-radius: var(--r);
      box-shadow: var(--shadow);
      filter: url(#sketchWobbleBold);
    }
    h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; color: var(--rm-teal-dark); }
    .sub { color: var(--rm-muted); line-height: 1.55; margin: 0 0 22px; font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 12.5px; color: var(--rm-muted); margin-bottom: 14px; }
    .input-wrap { position: relative; z-index: 0; }
    .input-wrap::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-input-bg); border: 2px solid var(--ink); border-radius: 10px;
      filter: url(#sketchWobble);
    }
    .input-wrap.pill::before { border-radius: 999px; }
    .input-wrap input, .input-wrap textarea {
      position: relative; z-index: 1; display: block;
      width: 100%; padding: 12px 14px; border: none; background: transparent;
      color: var(--rm-ink); font: inherit; font-size: 15px; box-sizing: border-box;
    }
    .input-wrap textarea { min-height: 70px; font-size: 14px; resize: vertical; }
    input:focus-visible, .btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .btn {
      position: relative; z-index: 0;
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 600;
      border-radius: 999px; padding: 12px 20px; font-size: 14px; transition: .15s transform;
      background: transparent;
    }
    .btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      filter: url(#sketchWobble);
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px) rotate(-0.4deg); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #2b1f0d; }
    .primary::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink); }
    .ghost { color: var(--rm-teal-dark); }
    .ghost::before { background: transparent; border: 2px solid var(--ink); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .muted { color: var(--rm-muted); font-size: 13px; }
    .err {
      position: relative; z-index: 0;
      color: var(--bad); padding: 12px 14px; font-size: 13px; margin-top: 12px;
    }
    .err::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px;
      background: rgba(192,69,58,.08); border: 2px solid var(--bad);
      filter: url(#sketchWobble);
    }
    :root {
      --rm-bg: #fbf7ec;
      --rm-panel: #ffffff;
      --rm-line: rgba(43,74,64,.12);
      --rm-teal: #3e7565;
      --rm-teal-dark: #2b4a40;
      --rm-sage: #9fbb94;
      --rm-tan: #e7c48f;
      --rm-ink: #24352e;
      --rm-muted: #5f7268;
      --rm-bubble-them-bg: #f1ead9;
      --rm-input-bg: #fffdf8;
    }
    :root[data-theme="dark"] {
      --rm-bubble-them-bg: #33443d;
      --rm-input-bg: #2a3a34;
      --bad: #e2685c;
      --shadow: 0 24px 60px rgba(0,0,0,.55);
      --ink: rgba(223,232,220,.55);
      --rm-header-bg: rgba(20,28,25,.85);
      --rm-bg: #1b2420;
      --rm-panel: #24342f;
      --rm-line: rgba(255,255,255,.14);
      --rm-teal: #5fa38c;
      --rm-teal-dark: #bfe0cf;
      --rm-sage: #8fb490;
      --rm-tan: #eccb98;
      --rm-ink: #eef2ea;
      --rm-muted: #9fb3a8;
    }
    .rm-page { background: var(--rm-bg); flex: 1; min-height: calc(100vh - 76px); padding: 32px; }
    .rm-topbar { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .rm-topbar b { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--rm-muted); }
    .rm-picker-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 18px; }
    .rm-level-card {
      position: relative; z-index: 0; min-width: 126px; padding: 12px 16px; text-align: center;
      color: var(--rm-teal-dark); flex-shrink: 0;
    }
    .rm-level-card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-level-card span, .rm-level-card em {
      display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--rm-muted); font-style: normal;
    }
    .rm-level-card b { display: block; font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1; margin: 3px 0; }
    .rm-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
    .rm-tab {
      position: relative; z-index: 0; border: none; background: transparent; cursor: pointer;
      padding: 9px 16px; font: inherit; font-weight: 700; font-size: 13px; color: var(--rm-muted);
    }
    .rm-tab::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      background: transparent; border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-tab.active { color: #2b1f0d; }
    .rm-tab.active::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); }
    .rm-tab:hover { transform: translateY(-1px); }
    .rm-tab:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-exit-btn {
      border: none; background: transparent; cursor: pointer; font: inherit;
      font-size: 12px; font-weight: 600; color: var(--rm-muted); padding: 4px 0;
    }
    .rm-exit-btn:hover { color: var(--rm-teal-dark); text-decoration: underline; }
    .rm-exit-btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; color: var(--rm-teal-dark); margin: 0 0 6px; }
    .rm-sub { color: var(--rm-muted); font-size: 14px; margin: 0 0 22px; max-width: 60ch; line-height: 1.5; }
    .rm-hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    @media (max-width: 900px) { .rm-hero-grid { grid-template-columns: 1fr; } }
    .rm-hero {
      position: relative; z-index: 0;
      cursor: pointer; border: none; background: transparent; font: inherit; text-align: left;
      padding: 0; display: flex; flex-direction: column; transition: .2s transform;
    }
    .rm-hero::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-hero:hover { transform: translateY(-5px) rotate(-0.6deg) scale(1.015); }
    .rm-hero:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; }
    .rm-hero-scene { padding: 20px 20px 0; height: 190px; display: flex; align-items: center; justify-content: center; }
    .rm-hero-scene svg { width: 100%; height: 100%; overflow: visible; }
    .rm-hero-cap { padding: 14px 20px 20px; }
    .rm-hero-cap b { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 19px; color: var(--rm-teal-dark); display: block; margin-bottom: 4px; }
    .rm-hero-cap span { font-size: 12.5px; color: var(--rm-muted); display: block; margin-bottom: 14px; }
    .rm-hero-start { position: relative; z-index: 0; display: inline-block; padding: 8px 18px; font-weight: 700; font-size: 12.5px; color: #2b1f0d; }
    .rm-hero-start::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-secondary-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 22px; }
    .rm-secondary-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--rm-muted); margin-right: 4px; }
    .rm-chip {
      position: relative; z-index: 0;
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px;
      font: inherit; font-size: 13px; font-weight: 600; color: var(--rm-teal-dark);
      cursor: pointer; border: none; background: transparent;
    }
    .rm-chip::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-chip:hover { transform: translateY(-1px); }
    .rm-chip:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 30px; }
    .rm-card {
      position: relative; z-index: 0;
      padding: 20px 16px; text-align: left; cursor: pointer; font: inherit; color: var(--rm-ink);
      display: flex; flex-direction: column; gap: 8px; transition: .15s transform; background: transparent; border: none;
    }
    .rm-card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-card:hover { transform: translateY(-2px) rotate(-0.3deg); }
    .rm-card:hover::before { border-color: var(--rm-teal); }
    .rm-card:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-card .rm-ico { font-size: 26px; }
    .rm-card b { font-family: Fraunces, Georgia, serif; font-size: 16px; color: var(--rm-teal-dark); }
    .rm-card span { font-size: 12.5px; color: var(--rm-muted); }
    .rm-freeform { position: relative; z-index: 0; padding: 20px; }
    .rm-freeform::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-path-panel {
      position: relative; z-index: 0; padding: 24px;
    }
    .rm-path-panel::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 18px;
      background: var(--rm-panel); border: 2.5px solid var(--ink); filter: url(#sketchWobbleBold);
    }
    .rm-path-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .rm-path-stats div {
      border: 2px dashed var(--rm-line); border-radius: 12px; padding: 12px; text-align: center;
    }
    .rm-path-stats b { display: block; font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); font-size: 25px; line-height: 1; }
    .rm-path-stats span { display: block; margin-top: 5px; color: var(--rm-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
    .rm-path {
      display: grid; grid-template-columns: repeat(6, minmax(96px, 1fr)); gap: 12px; align-items: start;
    }
    .rm-path-node { position: relative; min-height: 138px; padding: 46px 12px 12px; text-align: center; }
    .rm-path-node::before {
      content: ""; position: absolute; inset: 18px 0 0; z-index: -1; border-radius: 15px;
      background: var(--rm-input-bg); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-path-node .dot {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
      background: var(--rm-panel); border: 2px solid var(--ink); color: var(--rm-muted);
      font-weight: 800; box-shadow: 0 8px 20px rgba(43,74,64,.12);
    }
    .rm-path-node.done .dot { background: var(--rm-sage); color: #16261d; }
    .rm-path-node.current .dot { background: var(--rm-tan); color: #2b1f0d; }
    .rm-path-node b { display: block; color: var(--rm-teal-dark); font-family: Fraunces, Georgia, serif; font-size: 14px; line-height: 1.2; }
    .rm-path-node em { display: block; margin-top: 6px; color: var(--rm-muted); font-size: 11.5px; line-height: 1.35; font-style: normal; }
    .rm-next-step { margin: 20px 0 0; color: var(--rm-muted); font-size: 13px; }
    .rm-career-layout {
      display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, .8fr);
      gap: 22px; align-items: start; max-width: 1240px;
    }
    .rm-practice-snapshot { position: relative; z-index: 0; padding: 22px; min-height: 100%; }
    .rm-practice-snapshot::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 18px;
      background: var(--rm-panel); border: 2.5px solid var(--ink); filter: url(#sketchWobbleBold);
    }
    .rm-practice-snapshot h3 {
      margin: 0 0 4px; color: var(--rm-teal-dark); font-family: Fraunces, Georgia, serif; font-size: 19px;
    }
    .rm-practice-snapshot > p { margin: 0 0 20px; color: var(--rm-muted); font-size: 13px; line-height: 1.5; }
    .rm-snapshot-section { border-top: 1px solid var(--rm-line); padding-top: 14px; margin-top: 14px; }
    .rm-snapshot-label { color: var(--rm-muted); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .rm-snapshot-next { margin: 6px 0 0; color: var(--rm-ink); font-size: 14px; line-height: 1.45; }
    .rm-snapshot-next b { color: var(--rm-teal-dark); }
    .rm-snapshot-list { display: grid; gap: 10px; margin-top: 10px; }
    .rm-snapshot-item { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .rm-snapshot-item b { color: var(--rm-teal-dark); font-family: Fraunces, Georgia, serif; font-size: 14px; }
    .rm-snapshot-item span { color: var(--rm-muted); font-size: 11px; white-space: nowrap; }
    .rm-snapshot-empty { margin: 8px 0 0; color: var(--rm-muted); font-size: 13px; line-height: 1.5; }
    .rm-history-list { display: grid; gap: 12px; max-width: 860px; }
    .rm-trends { position: relative; z-index: 0; display: grid; gap: 16px; max-width: 860px; padding: 20px; margin-bottom: 14px; }
    .rm-trend-row { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; }
    .rm-trend-meta { display: grid; gap: 6px; }
    .rm-trend-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--rm-muted); }
    .rm-trend-sentence { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--rm-ink); }
    .rm-trend-row.pending .rm-trend-sentence { color: var(--rm-muted); }
    .rm-spark { display: block; }
    .rm-history-card { position: relative; z-index: 0; padding: 18px; }
    .rm-history-card::before, .rm-empty-state::before, .rm-trends::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-history-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
    .rm-history-card-head b { font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); font-size: 16px; }
    .rm-history-card-head span { color: var(--rm-muted); font-size: 11.5px; flex-shrink: 0; }
    .rm-history-card p { margin: 0 0 12px; color: var(--rm-ink); line-height: 1.5; font-size: 13.5px; }
    .rm-history-card dl { display: grid; gap: 8px; margin: 0; }
    .rm-history-card dl div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; border-top: 1px solid var(--rm-line); padding-top: 8px; }
    .rm-history-card dt { color: var(--rm-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
    .rm-history-card dd { margin: 0; color: var(--rm-ink); font-size: 13px; line-height: 1.45; }
    .rm-empty-state { position: relative; z-index: 0; max-width: 520px; padding: 24px; }
    .rm-empty-state b { font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); font-size: 18px; }
    .rm-empty-state p { margin: 8px 0 0; color: var(--rm-muted); line-height: 1.5; }
    .rm-thinking { display: inline-flex; gap: 4px; align-items: center; }
    .rm-thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--rm-muted); animation: thinkBounce 1.2s ease-in-out infinite; }
    .rm-thinking span:nth-child(2) { animation-delay: .15s; }
    .rm-thinking span:nth-child(3) { animation-delay: .3s; }
    @keyframes thinkBounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .rm-thinking span { animation: none; opacity: .8; } }
    .rm-btn {
      position: relative; z-index: 0;
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 600;
      border-radius: 999px; padding: 11px 18px; font-size: 13.5px; transition: .15s transform; background: transparent;
    }
    .rm-btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      filter: url(#sketchWobble);
    }
    .rm-btn:hover:not(:disabled) { transform: translateY(-1px) rotate(-0.4deg); }
    .rm-btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .rm-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rm-btn.primary { color: #2b1f0d; }
    .rm-btn.primary::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink); }
    .rm-btn.ghost { color: var(--rm-teal-dark); }
    .rm-btn.ghost::before { background: transparent; border: 2px solid var(--ink); }
    .rm-btn.mic { color: #fff; }
    .rm-btn.mic::before { background: var(--rm-teal); border: 2px solid var(--ink); }
    .rm-btn.mic.on::before { background: var(--bad); }
    .rm-session { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 720px; margin: 0 auto; }
    .rm-log {
      position: relative; z-index: 0;
      padding: 16px; height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .rm-log::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
    .rm-bubble .who { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; color: var(--rm-muted); }
    .rm-bubble.me { align-self: flex-end; background: var(--rm-sage); color: #16261d; }
    .rm-bubble.them { align-self: flex-start; background: var(--rm-bubble-them-bg); color: var(--rm-ink); }
    .rm-bubble.sys { align-self: center; color: var(--rm-muted); font-size: 12px; font-style: italic; }
    .rm-controls { display: flex; gap: 8px; align-items: center; }
    .rm-mic-state { font-size: 12px; color: var(--rm-muted); text-align: center; margin: 6px 0 0; }
    .rm-btn.sm { padding: 6px 12px; font-size: 12px; }
    .rm-stage { position: relative; z-index: 0; max-width: 720px; margin: 0 auto; padding: 22px 22px 20px; }
    .rm-stage::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 22px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      filter: url(#sketchWobbleBold);
    }
    .rm-stage-label { text-align: center; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--rm-muted); margin: 0 0 10px; }
    .rm-stage-scene { height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .rm-stage-scene.is-pitch { height: 320px; }
    .rm-stage-scene svg { width: 100%; height: 100%; overflow: visible; }
    .rm-slide-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 10px; font-size: 12.5px; color: var(--rm-muted); }
    .rm-stage-divider { border: none; border-top: 2px dashed var(--rm-line); margin: 0 0 14px; }
    .rm-stage-log { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 12px; }
    .rm-stage-controls { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .rm-stage-mic-state { font-size: 12px; color: var(--rm-muted); text-align: center; margin: 6px 0 0; }
    .rm-mic-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 2px; }
    .rm-caption { min-height: 20px; text-align: center; font-size: 13.5px; color: var(--rm-ink); max-width: 48ch; margin: 0 0 12px; line-height: 1.5; }
    .rm-caption .who { font-weight: 700; color: var(--rm-muted); text-transform: uppercase; font-size: 10px; letter-spacing: .05em; margin-right: 6px; }
    .rm-mic-big {
      position: relative; z-index: 0;
      width: 92px; height: 92px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 34px; color: #fff; display: flex; align-items: center; justify-content: center;
      transition: .15s transform;
    }
    .rm-mic-big::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: var(--rm-teal); border: 3px solid var(--ink); filter: url(#sketchWobbleBold);
    }
    .rm-mic-big:hover { transform: scale(1.04) rotate(-2deg); }
    .rm-mic-big:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; }
    .rm-mic-big.on::before { background: var(--bad); }
    .rm-mic-big.on { animation: micPulse 1.6s ease-in-out infinite; }
    @keyframes micPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { .rm-mic-big.on { animation: none; } }
    .rm-mic-secondary { display: flex; gap: 8px; margin-top: 12px; }
    .rm-transcript-panel { width: 100%; margin-top: 12px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
    .rm-type-panel { width: 100%; margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .rm-rubric { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
    .rm-rubric .blk { position: relative; z-index: 0; padding: 18px 20px; }
    .rm-rubric .blk::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2px solid var(--ink);
      filter: url(#sketchWobble);
    }
    .rm-rubric .blk h4 { margin: 0 0 8px; font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); font-size: 15px; }
    .rm-rubric .blk p { margin: 0; color: var(--rm-ink); font-size: 14px; line-height: 1.6; }
    .rm-rubric .blk.progress::before { background: linear-gradient(135deg, rgba(159,187,148,.22), rgba(231,196,143,.2)), var(--rm-panel); }
    .rm-curtain { position: relative; z-index: 0; max-width: 640px; margin: 0 auto 18px; padding: 22px 24px; }
    .rm-curtain::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px;
      background: var(--rm-panel); border: 2.5px solid var(--ink); filter: url(#sketchWobbleBold);
    }
    .rm-curtain-eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--rm-muted); margin-bottom: 14px; }
    .rm-curtain-quote {
      margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px;
      line-height: 1.35; color: var(--rm-teal-dark); border-left: 3px solid var(--rm-tan); padding-left: 16px;
    }
    .rm-curtain-why { margin: 14px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--rm-muted); }
    @media (max-width: 640px) { .rm-curtain-quote { font-size: 19px; } }
    .rm-cam { position: fixed; width: 160px; border-radius: 14px; overflow: hidden; border: 2px solid var(--rm-teal); box-shadow: 0 10px 30px rgba(0,0,0,.3); background:#000; z-index: 50; }
    .rm-cam.pos-br { right: 18px; bottom: 18px; }
    .rm-cam.pos-bl { left: 18px; bottom: 18px; }
    .rm-cam.pos-tr { right: 18px; top: 90px; }
    .rm-cam video { width: 100%; display: block; transform: scaleX(-1); }
    .rm-cam-close {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
      border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 20px;
      cursor: pointer; padding: 0;
    }
    /* Vertically centered on the right edge - never competes with the topbar
       (Exit button, top) or End session/camera (bottom) on any template,
       regardless of which corner that template's camera happens to use. */
    .rm-wpm-badge {
      position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 45;
      padding: 18px 16px; border-radius: 18px; text-align: center; min-width: 78px;
    }
    .rm-wpm-badge::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 18px;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .rm-wpm-badge b { display: block; font-size: 28px; font-family: Fraunces, Georgia, serif; color: var(--rm-teal-dark); line-height: 1; }
    .rm-wpm-badge span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--rm-muted); margin-top: 5px; }
    .rm-wpm-badge em { display: block; font-size: 9.5px; font-style: normal; color: var(--rm-muted); margin-top: 8px; line-height: 1.3; }
    @media (max-width: 760px) {
      .rm-page { padding: 22px 16px; }
      header { padding: 14px 16px; }
      .header-right { gap: 10px; }
      .founder-link { font-size: 10.5px; max-width: 68px; line-height: 1.25; }
      .rm-picker-head { display: block; }
      .rm-level-card { width: 128px; margin: 0 0 18px; }
      .rm-path { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .rm-path-stats { grid-template-columns: 1fr; }
      .rm-history-card dl div { grid-template-columns: 1fr; gap: 4px; }
      .rm-trend-row { grid-template-columns: 1fr; gap: 8px; }
    }
    @media (max-width: 980px) {
      .rm-career-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="sketchWobble" x="-20%" y="-30%" width="140%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="sketchWobbleBold" x="-20%" y="-30%" width="140%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="11" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div class="shell">
    <header>
      <button class="brand" id="brandHome" type="button" title="Back to your scenarios" aria-label="Back to your scenarios">
        <svg class="brand-wash" viewBox="0 0 56 56" aria-hidden="true">
          <path d="M28,4 C40,3 51,12 51,26 C52,40 40,51 27,51 C13,52 4,41 4,27 C3,14 15,5 28,4 Z"
                fill="var(--rm-tan)" opacity="0.35" transform="rotate(-6 28 28)" filter="url(#sketchWobbleBold)" />
        </svg>
        <img src="/logo.png" alt="" />
        <div class="brand-text">
          <h1>Green Room</h1>
          <p>Practice space</p>
        </div>
      </button>
      <div class="header-right">
        <button class="founder-link" id="founderNoteBtn" type="button">Why I made this</button>
        <div class="header-user" id="headerUser" hidden></div>
        <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>
    <main id="main"></main>
    <div id="founderNoteRoot"></div>
  </div>

<script src="/micTranscriptAccumulator.js"></script>
<script src="/sessionProgress.js"></script>
<script>
const S = {
  token: localStorage.getItem("greenRoomToken") || "",
  student: null,
  screen: "gate",
  authMode: "register",
  practiceTemplate: null,
  practiceLog: [],
  micOn: false,
  micStartedAt: 0,
  camDismissed: false,
  sending: false,
  rubric: null,
  viaFreeText: false,
  slides: [],
  slideIndex: 0,
  showTranscript: false,
  showTypeInput: false,
  liveWpm: null,
  setupTemplateId: null,
  soundcheckMode: false,
  soundcheckText: "",
  pickerTab: "practice",
  founderNoteOpen: false,
};

const main = document.getElementById("main");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("greenRoomTheme", theme);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
(() => {
  const saved = localStorage.getItem("greenRoomTheme");
  const preferred = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
})();
document.getElementById("themeToggle").onclick = toggleTheme;
document.getElementById("brandHome").onclick = goHome;
document.getElementById("founderNoteBtn").onclick = () => {
  S.founderNoteOpen = true;
  renderFounderNote();
};

const SESSION_COUNT_KEY = "greenRoomSessionCount";
function getSessionCount() {
  return Number(localStorage.getItem(SESSION_COUNT_KEY) || 0);
}
function incrementSessionCount() {
  const next = getSessionCount() + 1;
  localStorage.setItem(SESSION_COUNT_KEY, String(next));
  return next;
}
function renderHeaderUser() {
  const el = document.getElementById("headerUser");
  if (!el) return;
  if (!S.student) {
    el.hidden = true;
    el.innerHTML = "";
    return;
  }
  const count = getSessionCount();
  const badges = milestoneProgress();
  el.hidden = false;
  el.innerHTML = `
    <div class="header-user-main">
      <button class="logout-link" id="logoutBtn" type="button">Log out</button>
      <b>${esc(S.student.name || "")}</b>
    </div>
    <span>${badges.earned} of ${badges.total} badges · ${count} session${count === 1 ? "" : "s"}</span>`;
  $("#logoutBtn", el).onclick = logout;
}

function renderFounderNote() {
  const root = document.getElementById("founderNoteRoot");
  if (!root) return;
  if (!S.founderNoteOpen) {
    root.innerHTML = "";
    return;
  }
  root.innerHTML = `
    <div class="rm-modal-backdrop" id="founderBackdrop" role="presentation">
      <section class="rm-founder-modal" role="dialog" aria-modal="true" aria-labelledby="founderTitle">
        <button class="rm-modal-close" id="founderClose" type="button" aria-label="Close founder note">×</button>
        <h2 id="founderTitle">Why I made this</h2>
        <p>I built Green Room because I know how hard it can be to speak when the room suddenly feels bigger than you. A few years ago, I struggled with public speaking myself. I would know what I wanted to say, then lose it once people were watching.</p>
        <p>Practicing helped, but only when it felt close to the real moment: a question after a pitch, a panel that pushes back, a quiet audience member waiting for the point. I wanted to make a space where people could rehearse those moments before they actually matter.</p>
        <p class="signoff">This is a practice room for anyone building confidence one rep at a time.</p>
      </section>
    </div>`;
  $("#founderClose").onclick = closeFounderNote;
  $("#founderBackdrop").onclick = (e) => {
    if (e.target.id === "founderBackdrop") closeFounderNote();
  };
  document.addEventListener("keydown", handleFounderNoteKeydown);
}

function closeFounderNote() {
  S.founderNoteOpen = false;
  document.removeEventListener("keydown", handleFounderNoteKeydown);
  renderFounderNote();
  document.getElementById("founderNoteBtn")?.focus();
}

function handleFounderNoteKeydown(e) {
  if (e.key === "Escape" && S.founderNoteOpen) closeFounderNote();
}

function logout() {
  if (S.micOn) stopMicCapture({ cancel: true });
  stopCamPreview();
  localStorage.removeItem("greenRoomToken");
  S.token = "";
  S.student = null;
  S.screen = "gate";
  S.authMode = "login";
  S.practiceTemplate = null;
  S.practiceLog = [];
  S.micOn = false;
  S.sending = false;
  S.rubric = null;
  S.bestLine = null;
  S.whyItLanded = null;
  S.viaFreeText = false;
  S.slides = [];
  S.slideIndex = 0;
  S.showTranscript = false;
  S.showTypeInput = false;
  S.liveWpm = null;
  S.setupTemplateId = null;
  S.soundcheckMode = false;
  S.soundcheckText = "";
  renderHeaderUser();
  render();
}

const SESSION_HISTORY_KEY = "greenRoomSessionHistory";
function getSessionHistory() {
  try { return JSON.parse(localStorage.getItem(SESSION_HISTORY_KEY) || "[]"); } catch { return []; }
}
function pushSessionHistory(entry) {
  const list = getSessionHistory();
  list.unshift(entry);
  localStorage.setItem(SESSION_HISTORY_KEY, JSON.stringify(list.slice(0, 20)));
}
function firstSentence(s, maxLen) {
  const trimmed = String(s || "").trim();
  const m = trimmed.match(/^[^.!?]*[.!?]/);
  const sentence = m ? m[0] : trimmed;
  return sentence.length > maxLen ? sentence.slice(0, maxLen - 1) + "…" : sentence;
}

const THINKING_HTML = `<span class="rm-thinking"><span></span><span></span><span></span></span>`;

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}

function err(e) {
  const el = $("#err");
  if (el) el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
}
function status(msg) {
  const el = $("#status");
  if (el) el.textContent = msg || "";
}

function render() {
  if (S.screen === "picker") renderPicker();
  else if (S.screen === "soundcheck") renderSoundcheck();
  else if (S.screen === "setup") renderSetup();
  else if (S.screen === "practice") (S.viaFreeText ? renderPracticeChat() : renderPracticeStaged());
  else if (S.screen === "practiceEnd") renderPracticeEnd();
  else renderGate();
}

function renderGate() {
  main.innerHTML = `
    <div class="fill-gate">
      <div class="card">
        <h2>${S.authMode === "register" ? "Step into the green room" : "Welcome back"}</h2>
        <p class="sub">${S.authMode === "register"
          ? "Warm up before you're on. Practice interviews, pitches, exam vivas and talks against a live scenario partner."
          : "Sign back in to pick up where you left off."}</p>
        ${S.authMode === "register" ? `<label>Name <div class="input-wrap"><input id="name" placeholder="Your name" autocomplete="name" /></div></label>` : ""}
        <label>Email <div class="input-wrap"><input id="email" type="email" placeholder="you@example.com" autocomplete="email" /></div></label>
        <label>Password <div class="input-wrap"><input id="pass" type="password" placeholder="At least 8 characters" autocomplete="current-password" /></div></label>
        ${S.authMode === "register" ? `<label>Invite code <div class="input-wrap"><input id="inviteCode" placeholder="Only needed for private launch" autocomplete="off" /></div></label>` : ""}
        <div class="actions">
          <button class="btn primary" id="go">${S.authMode === "register" ? "Check in" : "Sign in"}</button>
          <button class="btn ghost" id="sw">${S.authMode === "register" ? "I have an account" : "Create account"}</button>
        </div>
        <p class="muted" id="status" style="margin-top:12px"></p>
        <div id="err"></div>
      </div>
    </div>`;
  $("#sw").onclick = () => { S.authMode = S.authMode === "register" ? "login" : "register"; render(); };
  $("#go").onclick = async () => {
    try {
      status(S.authMode === "register" ? "Checking you in…" : "Signing you in…");
      const email = $("#email").value.trim();
      const password = $("#pass").value;
      if (!email) throw new Error("Please enter your email");
      if (password.length < 8) throw new Error("Please enter a password with at least 8 characters");
      let j;
      if (S.authMode === "register") {
        const name = $("#name").value.trim();
        const inviteCode = $("#inviteCode").value.trim();
        if (!name) throw new Error("Please enter your name");
        j = await api("/api/auth/register", { name, email, password, inviteCode });
      } else {
        j = await api("/api/auth/login", { email, password });
      }
      S.token = j.token;
      localStorage.setItem("greenRoomToken", j.token);
      S.student = j.student;
      S.screen = "picker";
      render();
      renderHeaderUser();
    } catch (e) { err(e); }
  };
}

function sceneWhiteboard(slideUrl) {
  if (slideUrl) {
    return `<svg viewBox="0 0 520 320" aria-hidden="true">
      <line x1="152" y1="284" x2="108" y2="316" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

// History is capped at 20 entries, so a milestone's evidence eventually falls off
// the end. Earning is permanent: remember the ids so an old badge is never revoked.
const EARNED_MILESTONES_KEY = "greenRoomEarnedMilestones";
function rememberedMilestoneIds() {
  try {
    const v = JSON.parse(localStorage.getItem(EARNED_MILESTONES_KEY) || "[]");
    return Array.isArray(v) ? v.filter((id) => typeof id === "string") : [];
  } catch { return []; }
}
function milestoneProgress(history = getSessionHistory()) {
  const remembered = new Set(rememberedMilestoneIds());
  const milestones = GreenRoomProgress.milestoneProgress(history).milestones
    .map((m) => ({ ...m, earned: m.earned || remembered.has(m.id) }));
  const earnedIds = milestones.filter((m) => m.earned).map((m) => m.id);
  try { localStorage.setItem(EARNED_MILESTONES_KEY, JSON.stringify(earnedIds)); } catch {}
  return {
    milestones,
    earned: earnedIds.length,
    total: milestones.length,
    next: milestones.find((m) => !m.earned) || null,
  };
}

function careerProgress(history = getSessionHistory()) {
  const p = milestoneProgress(history);
  return {
    count: getSessionCount(),
    uniqueTemplates: GreenRoomProgress.distinctTemplates(history).size,
    earned: p.earned,
    total: p.total,
    milestones: p.milestones,
    next: p.next,
  };
}

function sparklineSvg(row) {
  const w = 140, h = 36, pad = 4;
  const vs = row.values;
  const lo = Math.min(...vs), hi = Math.max(...vs);
  const span = (hi - lo) || 1;
  const top = hi + span * 0.1, bottom = lo - span * 0.1;
  const x = (i) => pad + (i * (w - pad * 2)) / Math.max(1, vs.length - 1);
  const y = (v) => h - pad - ((v - bottom) / (top - bottom)) * (h - pad * 2);
  const pts = vs.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let band = "";
  if (row.band) {
    const yTop = y(Math.min(top, row.band.to));
    const yBot = y(Math.max(bottom, row.band.from));
    if (yBot > yTop) {
      band = `<rect x="0" y="${yTop.toFixed(1)}" width="${w}" height="${(yBot - yTop).toFixed(1)}" fill="var(--rm-sage)" opacity="0.15" />`;
    }
  }
  return `<svg class="rm-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${band}
    <polyline points="${pts}" fill="none" stroke="var(--rm-teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketchWobble)" />
    <circle cx="${x(vs.length - 1).toFixed(1)}" cy="${y(vs[vs.length - 1]).toFixed(1)}" r="3" fill="var(--rm-tan)" />
  </svg>`;
}

const SOUND_CHECK_KEY = "greenRoomSoundCheckDone";
let pendingIntent = null;

function maybeSoundCheck(intentFn) {
  if (localStorage.getItem(SOUND_CHECK_KEY)) { intentFn(); return; }
  pendingIntent = intentFn;
  S.soundcheckMode = true;
  S.soundcheckText = "";
  S.camDismissed = false;
  S.screen = "soundcheck";
  render();
}

function finishSoundcheck() {
  localStorage.setItem(SOUND_CHECK_KEY, "1");
  S.soundcheckMode = false;
  S.soundcheckText = "";
  stopCamPreview();
  const intent = pendingIntent;
  pendingIntent = null;
  if (intent) intent();
  else { S.screen = "picker"; render(); }
}

async function startPracticeDirect(templateId, setupAnswer) {
  try {
    status("Setting the scene…");
    const t = CARD_TEMPLATES.find((x) => x.id === templateId);
    const description = setupAnswer ? `${t.defaultDescription} Specifically: ${setupAnswer}` : t.defaultDescription;
    const started = await api("/api/practice/start", { studentId: S.token, templateId, description, setupAnswer });
    beginPracticeSession(started, false);
  } catch (e) { err(e); }
}

async function startPracticeFromDescription() {
  try {
    const description = $("#freeDesc").value.trim();
    if (!description) { err(new Error("Describe your scenario first")); return; }
    status("Figuring out the best fit…");
    const inferred = await api("/api/practice/infer-scenario", { studentId: S.token, description });
    const started = await api("/api/practice/start", { studentId: S.token, templateId: inferred.templateId, description });
    beginPracticeSession(started, true);
  } catch (e) { err(e); }
}

let camStream = null;
let camRequesting = false;

function wpmBadgeHtml() {

// Fixed-position corner per template, chosen to stay clear of that
// template's own scene/controls rather than one hardcoded spot for all:
// pitch gets the slide-shuffle row along the bottom, so its camera moves
// left of center; interview reads naturally as "your own tile" beside the
// video call, so it sits top-right instead of bottom.
const CAM_POSITION_BY_TEMPLATE = {
  exam_viva: "pos-br",
  pitch: "pos-bl",
  interview: "pos-tr",
  public_speech: "pos-br",
  casual: "pos-bl",
};

function camWidgetHtml() {
  if (S.camDismissed) return "";
  const posClass = CAM_POSITION_BY_TEMPLATE[S.practiceTemplate?.templateId] || "pos-br";
  return `<div class="rm-cam ${posClass}" id="camWrap">
    <video id="camVideo" autoplay playsinline muted></video>
    <button class="rm-cam-close" id="camClose" title="Turn off camera">✕</button>
  </div>`;
}

function wireCamWidget() {
  const closeEl = $("#camClose");
  if (closeEl) closeEl.onclick = dismissCamPreview;
  mountCamPreview();
}

function mountCamPreview() {
  if (S.camDismissed || !navigator.mediaDevices?.getUserMedia) return;
  const videoEl = $("#camVideo");
  if (!videoEl) return;
  if (camStream) {
    videoEl.srcObject = camStream;
    return;
  }
  if (camRequesting) return;
  camRequesting = true;
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then((stream) => {
      camRequesting = false;
      if (S.camDismissed) { stream.getTracks().forEach((t) => t.stop()); return; }
      camStream = stream;
      const el = $("#camVideo");
      if (el) el.srcObject = stream;
      else stream.getTracks().forEach((t) => t.stop());
    })
    .catch((e) => {
      camRequesting = false;
      console.error("camera preview unavailable", e);
    });
}

function stopCamPreview() {
  if (camStream) {
    camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
  }
}

function dismissCamPreview() {
  S.camDismissed = true;
  stopCamPreview();

}

    err(new Error("That file type isn't supported here - export your slides as images (PNG or JPG) and upload those instead."));

async function sendPracticeMessage(text, durationSec) {
  if (S.sending) return;
  S.practiceLog.push({ role: "student", text });
  S.sending = true;
  render();
  try {
    const body = { studentId: S.token, text };
    if (typeof durationSec === "number" && durationSec > 0) body.durationSec = durationSec;
    const j = await api("/api/practice/message", body);
    for (const r of j.responses) S.practiceLog.push({ role: "agent", name: r.name, text: r.reply });
    S.sending = false;
    render();
    speakSequence(j.responses.map((r) => ({ text: r.reply, personaId: r.personaId })));
  } catch (e) {
    S.sending = false;
    render();
    err(e);
  }
}

function updateLiveWpm(text, durationSec) {
  if (text && durationSec >= 0.5) {
    const wordCount = text.split(/\s+/).filter(Boolean).length;
    S.liveWpm = Math.round(wordCount / (durationSec / 60));
  }
}

async function polishSpokenTranscript(text) {
  try {
    const j = await api("/api/practice/polish-transcript", { studentId: S.token, text });
    return (j.text || text).trim();
  } catch (e) {
    console.warn("transcript polish failed; using raw transcript", e);
    return text;

}

async function sendSpokenPracticeMessage(rawText, durationSec) {

  const text = await polishSpokenTranscript(rawText);
  updateLiveWpm(text, durationSec);

async function finishSoundcheckTranscript(rawText) {

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micStopRequested = false;
let micFatalError = false;
let micUsingRecorder = false;
let micRecorder = null;
let micRecordingStream = null;
let micAudioChunks = [];
let micCancelTurn = false;
let micAutoStopTimer = null;
const MAX_RECORDING_SECONDS = 45;
const micTranscriptAccumulator = createMicTranscriptAccumulator();

function toggleMic() {
  if (S.micOn) {
    stopMicCapture();
    return;
  }
  startMicCapture();
}

function recorderMimeType() {
  if (!window.MediaRecorder) return "";
  for (const type of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }
  return "";
}

async function transcribeRecordedAudio(blob) {
  status("Transcribing audio...");
  const durationSec = S.lastMicDurationSec || 0;
  const qs = new URLSearchParams({ studentId: S.token, durationSec: String(Math.round(durationSec * 10) / 10) });
  const res = await fetch(`/api/practice/transcribe-audio?${qs.toString()}`, {
    method: "POST",
    headers: {
      "Content-Type": blob.type || "audio/webm",
      "X-Green-Room-Duration-Sec": String(durationSec),
    },
    body: blob,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || "Audio transcription failed");
  return (j.text || "").trim();
}

async function finishMicTurnFromText(rawText, durationSec) {
  if (S.soundcheckMode) {
    render();
    if (rawText) finishSoundcheckTranscript(rawText);
    return;
  }
  render();
  if (rawText) sendSpokenPracticeMessage(rawText, durationSec);
  else if (micFatalError) alert("Couldn't access the microphone. Check your browser's mic permission for this site.");
}

function stopMicTracks() {
  if (micAutoStopTimer) {
    clearTimeout(micAutoStopTimer);
    micAutoStopTimer = null;
  }
  if (micRecordingStream) {
    micRecordingStream.getTracks().forEach((t) => t.stop());
    micRecordingStream = null;
  }
}

function stopMicCapture({ cancel = false } = {}) {
  micStopRequested = true;
  micCancelTurn = cancel;
  if (micUsingRecorder && micRecorder && micRecorder.state !== "inactive") {
    try { micRecorder.stop(); } catch (e) { console.error("recorder stop failed", e); }
  }
  if (recognition) {
    try { recognition.stop(); } catch {}
  }
}

async function startMicCapture() {
  micStopRequested = false;
  micFatalError = false;
  micCancelTurn = false;
  micTranscriptAccumulator.reset();
  micAudioChunks = [];

  if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
        video: false,
      });
      const mimeType = recorderMimeType();
      micRecordingStream = stream;
      micUsingRecorder = true;
      micRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      micRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) micAudioChunks.push(e.data);
      };
      micRecorder.onstop = async () => {
        const durationSec = S.micStartedAt ? (performance.now() - S.micStartedAt) / 1000 : 0;
        S.lastMicDurationSec = durationSec;
        const blob = new Blob(micAudioChunks, { type: micRecorder.mimeType || mimeType || "audio/webm" });
        S.micOn = false;
        S.micStartedAt = 0;
        render();
        stopMicTracks();
        if (micCancelTurn) {
          micCancelTurn = false;
          return;
        }

        if (!blob.size) {
          status("I couldn't record any audio. Check the mic permission and try again.");
          return;
        }
        let transcribedText = "";
        try {
          transcribedText = await transcribeRecordedAudio(blob);
        } catch (e) {
          console.error("audio transcription failed", e);
          status(e.message || "Audio transcription failed. Try again or type it instead.");
          return;
        }
        if (!transcribedText) {
          status("I couldn't catch speech clearly. Try again or type it instead.");
          return;
        }
        await finishMicTurnFromText(transcribedText, durationSec);
      };
      S.micOn = true;
      S.micStartedAt = performance.now();
      render();
      micRecorder.start(250);
      micAutoStopTimer = setTimeout(() => {
        if (S.micOn) {
          status(`Stopping at ${MAX_RECORDING_SECONDS} seconds to keep audio costs under control...`);
          stopMicCapture();
        }
      }, MAX_RECORDING_SECONDS * 1000);
      return;
    } catch (e) {
      console.error("audio recorder unavailable", e);
      stopMicTracks();
      micUsingRecorder = false;
      micRecorder = null;
      micAudioChunks = [];
    }
  }

  if (!SpeechRec) {
    alert("Speech recognition isn't supported in this browser. Try Chrome, or type instead.");
    return;
  }
  startRecognition({ backupOnly: false });
}

// Browser SpeechRecognition is now only the primary path when MediaRecorder is
// unavailable. During recorded turns, it quietly provides a last-ditch fallback.
function startRecognition({ backupOnly = false } = {}) {
  recognition = new SpeechRec();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.onstart = () => {
    if (backupOnly) return;
    S.micOn = true;
    if (!S.micStartedAt) S.micStartedAt = performance.now();
    render();
  };
  recognition.onresult = (e) => {
    micTranscriptAccumulator.recordResultEvent(e);
  };
  recognition.onerror = (e) => {
    console.error("speech recognition error", e.error);
    // Permission/device errors are fatal - don't loop restarting forever.
    // Everything else (no-speech, network blips, aborted) is transient;
    // onend decides whether to restart.
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
      micFatalError = true;
      micStopRequested = true;
    }
  };
  recognition.onend = () => {
    micTranscriptAccumulator.flushSession();
    if (backupOnly) return;
    if (micStopRequested) {
      S.micOn = false;
      const durationSec = S.micStartedAt ? (performance.now() - S.micStartedAt) / 1000 : 0;
      S.micStartedAt = 0;
      const text = micTranscriptAccumulator.text();
      finishMicTurnFromText(text, durationSec);
    } else {
      // Unexpected auto-stop mid-thought - restart without the student noticing.
      // A short delay avoids some browsers throwing if start() is called too
      // soon after the previous session's onend.
      setTimeout(() => {
        try { recognition.start(); } catch (e) { console.error("mic restart failed", e); }
      }, 50);
    }
  };
  try { recognition.start(); } catch (e) { console.error(e); }
}

function playAudioBlob(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    const done = () => { URL.revokeObjectURL(url); resolve(); };
    audio.addEventListener("ended", done);
    audio.addEventListener("error", done);
    audio.play().catch(done);
  });
}

async function speak(text, personaId) {
  if (!text) return;
  try {
    const res = await fetch("/api/practice/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId: S.token, text, personaId: personaId || "facilitator" }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    await playAudioBlob(blob);
  } catch (e) {
    console.error("speak failed", e);
  }
}

async function speakSequence(items) {
  for (const item of items) await speak(item.text, item.personaId);
}

function improvementNote(history) {
  if (!history || history.length < 2) return "";
  const current = history[0];
  const previous = history.slice(1).find((h) => h.rubric);
  if (!current?.rubric || !previous?.rubric) return "";
  const currentWords = `${current.rubric.articulation || ""} ${current.rubric.engagement || ""} ${current.rubric.contentCorrespondence || ""}`.toLowerCase();
  const previousWords = `${previous.rubric.articulation || ""} ${previous.rubric.engagement || ""} ${previous.rubric.contentCorrespondence || ""}`.toLowerCase();
  const strengths = [
    ["specificity", ["specific", "concrete", "example", "detail"]],
    ["focus", ["focused", "relevant", "on track", "correspondence"]],
    ["pace", ["pace", "wpm", "rushed", "hesitant", "conversational"]],
    ["engagement", ["engaged", "responsive", "answered", "follow-up"]],
    ["clarity", ["clear", "structured", "articulation", "concise"]],
  ];
  const gained = strengths.find(([_, words]) => words.some((w) => currentWords.includes(w)) && !words.some((w) => previousWords.includes(w)));
  if (gained) return `Compared with your previous ${previous.templateName || "session"}, this feedback shows stronger ${gained[0]}. Keep stacking that into the next rep.`;
  return `You now have ${history.length} saved sessions, so your feedback is starting to show patterns across practice instead of only one performance.`;
}

(async () => {
  if (S.token) {
    try {
      const j = await api("/api/student/" + S.token);
      S.student = j.student;
      S.screen = "picker";
    } catch {
      localStorage.removeItem("greenRoomToken");
      S.token = "";
      S.screen = "gate";
    }
  }
  render();
  renderHeaderUser();
})();
</script>
