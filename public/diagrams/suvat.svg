<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230"><rect width="420" height="230" rx="14" fill="#0b1220"/><line x1="40" y1="160" x2="380" y2="160" stroke="#8f9bb7" stroke-width="2"/><circle cx="80" cy="160" r="10" fill="#6ea8ff"/><circle cx="320" cy="160" r="10" fill="#3dd6a5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f0c45a"/></marker></defs><line x1="100" y1="160" x2="300" y2="160" stroke="#f0c45a" stroke-width="2.5" marker-end="url(#a)"/><text x="80" y="145" fill="#d7e3ff" font-size="12" text-anchor="middle" font-family="sans-serif">start</text><text x="320" y="145" fill="#d7e3ff" font-size="12" text-anchor="middle" font-family="sans-serif">end</text><text x="200" y="140" fill="#f0c45a" font-size="12" text-anchor="middle" font-family="sans-serif">s</text><text x="80" y="195" fill="#d7e3ff" font-size="12" text-anchor="middle" font-family="sans-serif">u</text><text x="320" y="195" fill="#d7e3ff" font-size="12" text-anchor="middle" font-family="sans-serif">v</text><text x="210" y="50" fill="#d7e3ff" font-size="14" text-anchor="middle" font-family="sans-serif">Straight-line motion (constant a)</text><text x="210" y="80" fill="#93a0b8" font-size="13" text-anchor="middle" font-family="sans-serif">v = u + at</text><text x="210" y="105" fill="#93a0b8" font-size="13" text-anchor="middle" font-family="sans-serif">s = ut + (1/2)at^2</text><text x="210" y="130" fill="#93a0b8" font-size="13" text-anchor="middle" font-family="sans-serif">v^2 = u^2 + 2as</text></svg>